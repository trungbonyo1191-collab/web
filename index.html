<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">OmniTools - Secure & Free Browser-Based File Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Open Source Libraries (Commercial Friendly: MIT & Apache 2.0) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

    <style>
        .tool-card { transition: all 0.2s ease; }
        .tool-card.active { border-color: #3b82f6; background-color: #eff6ff; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.12); }
        .drag-over { border-color: #3b82f6 !important; background-color: #eff6ff !important; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

    <div class="max-w-6xl mx-auto px-4 py-8">
        <!-- HEADER & LANGUAGE SWITCHER -->
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-8 border-b border-slate-200 pb-6">
            <div>
                <h1 id="main-heading" class="text-3xl font-extrabold text-slate-900 tracking-tight">OmniTools Workspace</h1>
                <p id="main-sub" class="text-slate-500 mt-1">Professional document & multimedia utilities. 100% Client-side privacy.</p>
            </div>
            <div class="flex items-center gap-3">
                <div class="inline-flex items-center gap-2 bg-emerald-100 text-emerald-800 text-xs font-semibold px-3.5 py-2 rounded-full">
                    <span>🔒 <span id="badge-text">100% Secure & Private</span></span>
                </div>
                <!-- Language Switcher -->
                <select id="langSelect" onchange="switchLanguage(this.value)" class="bg-white border border-slate-300 text-slate-700 text-xs font-semibold rounded-lg px-3 py-2 focus:outline-none focus:border-blue-500">
                    <option value="en">English (Global)</option>
                    <option value="vi">Tiếng Việt</option>
                </select>
            </div>
        </div>

        <!-- TOOLS GRID -->
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <button onclick="selectTool('removebg')" id="card-removebg" class="tool-card active text-left bg-white p-4 rounded-2xl border-2 border-slate-200 hover:border-blue-400">
                <div class="w-9 h-9 rounded-xl bg-pink-100 text-pink-600 flex items-center justify-center text-lg mb-2">✨</div>
                <h3 class="font-bold text-slate-900 text-sm" data-i18n="t_removebg">Background Remover</h3>
                <p class="text-xs text-slate-500 mt-1" data-i18n="d_removebg">Extract subject and make transparent PNG.</p>
            </button>

            <button onclick="selectTool('img2pdf')" id="card-img2pdf" class="tool-card text-left bg-white p-4 rounded-2xl border-2 border-slate-200 hover:border-blue-400">
                <div class="w-9 h-9 rounded-xl bg-sky-100 text-sky-600 flex items-center justify-center text-lg mb-2">📁</div>
                <h3 class="font-bold text-slate-900 text-sm" data-i18n="t_img2pdf">Images to PDF</h3>
                <p class="text-xs text-slate-500 mt-1" data-i18n="d_img2pdf">Merge multiple images into a single PDF.</p>
            </button>

            <button onclick="selectTool('word')" id="card-word" class="tool-card text-left bg-white p-4 rounded-2xl border-2 border-slate-200 hover:border-blue-400">
                <div class="w-9 h-9 rounded-xl bg-blue-100 text-blue-600 flex items-center justify-center text-lg mb-2">📝</div>
                <h3 class="font-bold text-slate-900 text-sm" data-i18n="t_word">PDF to Word</h3>
                <p class="text-xs text-slate-500 mt-1" data-i18n="d_word">Convert PDF text layout into editable DOCX.</p>
            </button>

            <button onclick="selectTool('excel')" id="card-excel" class="tool-card text-left bg-white p-4 rounded-2xl border-2 border-slate-200 hover:border-blue-400">
                <div class="w-9 h-9 rounded-xl bg-emerald-100 text-emerald-600 flex items-center justify-center text-lg mb-2">📊</div>
                <h3 class="font-bold text-slate-900 text-sm" data-i18n="t_excel">PDF to Excel</h3>
                <p class="text-xs text-slate-500 mt-1" data-i18n="d_excel">Extract tables and datasets into XLSX.</p>
            </button>

            <button onclick="selectTool('image')" id="card-image" class="tool-card text-left bg-white p-4 rounded-2xl border-2 border-slate-200 hover:border-blue-400">
                <div class="w-9 h-9 rounded-xl bg-amber-100 text-amber-600 flex items-center justify-center text-lg mb-2">🖼️</div>
                <h3 class="font-bold text-slate-900 text-sm" data-i18n="t_image">PDF to Images</h3>
                <p class="text-xs text-slate-500 mt-1" data-i18n="d_image">Render PDF pages to PNG zipped archive.</p>
            </button>

            <button onclick="selectTool('merge')" id="card-merge" class="tool-card text-left bg-white p-4 rounded-2xl border-2 border-slate-200 hover:border-blue-400">
                <div class="w-9 h-9 rounded-xl bg-indigo-100 text-indigo-600 flex items-center justify-center text-lg mb-2">📑</div>
                <h3 class="font-bold text-slate-900 text-sm" data-i18n="t_merge">Merge PDF</h3>
                <p class="text-xs text-slate-500 mt-1" data-i18n="d_merge">Combine multiple PDF files easily.</p>
            </button>

            <button onclick="selectTool('split')" id="card-split" class="tool-card text-left bg-white p-4 rounded-2xl border-2 border-slate-200 hover:border-blue-400">
                <div class="w-9 h-9 rounded-xl bg-rose-100 text-rose-600 flex items-center justify-center text-lg mb-2">✂️</div>
                <h3 class="font-bold text-slate-900 text-sm" data-i18n="t_split">Split PDF</h3>
                <p class="text-xs text-slate-500 mt-1" data-i18n="d_split">Extract specific pages or page ranges.</p>
            </button>

            <button onclick="selectTool('compress')" id="card-compress" class="tool-card text-left bg-white p-4 rounded-2xl border-2 border-slate-200 hover:border-blue-400">
                <div class="w-9 h-9 rounded-xl bg-purple-100 text-purple-600 flex items-center justify-center text-lg mb-2">🗜️</div>
                <h3 class="font-bold text-slate-900 text-sm" data-i18n="t_compress">Compress PDF</h3>
                <p class="text-xs text-slate-500 mt-1" data-i18n="d_compress">Reduce file size optimizing inner elements.</p>
            </button>
        </div>

        <!-- MAIN INTERACTIVE WORKSPACE -->
        <div class="bg-white p-6 md:p-8 rounded-2xl border border-slate-200 shadow-sm">
            <h2 id="panel-title" class="text-xl font-bold text-slate-900">Background Remover</h2>
            <p id="panel-desc" class="text-sm text-slate-500 mt-1 mb-5">Upload an image to automatically isolate the foreground subject.</p>

            <!-- Drag & Drop Upload Zone -->
            <div id="dropZone" class="border-2 border-dashed border-slate-300 rounded-xl p-8 text-center hover:border-blue-500 transition bg-slate-50/50 cursor-pointer">
                <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleFileSelect(this.files)">
                <div class="flex flex-col items-center justify-center">
                    <svg class="w-12 h-12 text-slate-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                    </svg>
                    <p id="drop-text" class="text-sm font-medium text-slate-700">Drag & drop files here, or <span class="text-blue-600 underline">browse</span></p>
                    <p id="file-hint" class="text-xs text-slate-400 mt-2">Select 1 image file (JPG, PNG, WebP)</p>
                    <p id="selectedFileName" class="text-xs font-semibold text-emerald-600 mt-3"></p>
                </div>
            </div>

            <!-- Custom Options for Split PDF -->
            <div id="opt-split" class="hidden mt-4">
                <label id="lbl-split" class="block text-sm font-medium text-slate-700 mb-1">Enter page range (e.g., 1-3, 5):</label>
                <input type="text" id="splitRange" placeholder="e.g. 1-2, 4" class="w-full md:w-80 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
            </div>

            <!-- Custom Options for Compress PDF -->
            <div id="opt-compress" class="hidden mt-4">
                <label id="lbl-compress" class="block text-sm font-medium text-slate-700 mb-1">Compression Level:</label>
                <select id="compressLevel" class="w-full md:w-80 border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white">
                    <option value="0.75" data-i18n="opt_low">Light (High Quality - 75%)</option>
                    <option value="0.5" selected data-i18n="opt_med">Medium (Balanced - 50%)</option>
                    <option value="0.3" data-i18n="opt_high">High (Smallest Size - 30%)</option>
                </select>
            </div>

            <!-- Action & Status Bar -->
            <div class="mt-6 flex flex-wrap items-center gap-4">
                <button onclick="runTool()" id="runBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2.5 rounded-xl transition shadow-sm">
                    Process File
                </button>
                <span id="statusText" class="text-sm text-slate-600 font-medium"></span>
            </div>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let currentLang = 'en';
        let currentTool = 'removebg';
        let selectedFilesObject = null;

        const i18n = {
            en: {
                pageTitle: "OmniTools - Secure & Free Browser-Based File Suite",
                mainHeading: "OmniTools Workspace",
                mainSub: "Professional document & multimedia utilities. 100% Client-side privacy.",
                badgeText: "100% Secure & Private",
                runBtn: "Process File",
                dropText: "Drag & drop files here, or browse",
                t_removebg: "Background Remover", d_removebg: "Extract subject and make transparent PNG.",
                t_img2pdf: "Images to PDF", d_img2pdf: "Merge multiple images into a single PDF.",
                t_word: "PDF to Word", d_word: "Convert PDF text layout into editable DOCX.",
                t_excel: "PDF to Excel", d_excel: "Extract tables and datasets into XLSX.",
                t_image: "PDF to Images", d_image: "Render PDF pages to PNG zipped archive.",
                t_merge: "Merge PDF", d_merge: "Combine multiple PDF files easily.",
                t_split: "Split PDF", d_split: "Extract specific pages or page ranges.",
                t_compress: "Compress PDF", d_compress: "Reduce file size optimizing inner elements.",
                hint_removebg: "Select 1 image file (JPG, PNG, WebP)",
                hint_img2pdf: "Select multiple images to merge into PDF",
                hint_word: "Select 1 PDF file to convert to Word",
                hint_excel: "Select 1 PDF file containing tables",
                hint_image: "Select 1 PDF file to export pages as images",
                hint_merge: "Select multiple PDF files to combine",
                hint_split: "Select 1 PDF file and specify page ranges below",
                hint_compress: "Select 1 PDF file to reduce size",
                lblSplit: "Enter page range (e.g., 1-3, 5):",
                lblCompress: "Compression Level:",
                optLow: "Light (High Quality - 75%)",
                optMed: "Medium (Balanced - 50%)",
                optHigh: "High (Smallest Size - 30%)"
            },
            vi: {
                pageTitle: "OmniTools - Trạm Công Cụ Đa Năng Miễn Phí & Bảo Mật",
                mainHeading: "Trạm Công Cụ OmniTools",
                mainSub: "Hệ sinh thái xử lý tài liệu & đa phương tiện chuyên nghiệp. Bảo mật 100% trên trình duyệt.",
                badgeText: "Bảo mật tuyệt đối — Chạy trên máy",
                runBtn: "Bắt đầu xử lý",
                dropText: "Kéo & thả tệp vào đây, hoặc nhấn để chọn",
                t_removebg: "Xóa Phông Nền Ảnh", d_removebg: "Tách nền ảnh, tạo ảnh trong suốt tự động.",
                t_img2pdf: "Ảnh sang PDF", d_img2pdf: "Gộp nhiều ảnh thành 1 file PDF duy nhất.",
                t_word: "PDF sang Word", d_word: "Chuyển tài liệu PDF thành tệp DOCX chỉnh sửa được.",
                t_excel: "PDF sang Excel", d_excel: "Trích xuất bảng dữ liệu từ PDF sang XLSX.",
                t_image: "PDF sang hình ảnh", d_image: "Xuất từng trang PDF thành ảnh PNG, nén ZIP.",
                t_merge: "Gộp PDF", d_merge: "Kết hợp nhiều tài liệu PDF thành một tệp.",
                t_split: "Tách PDF", d_split: "Tách trang theo khoảng tùy chọn.",
                t_compress: "Nén PDF", d_compress: "Giảm dung lượng PDF trực tiếp.",
                hint_removebg: "Chọn 1 tệp ảnh (JPG, PNG, WebP)",
                hint_img2pdf: "Chọn nhiều ảnh để gộp thành file PDF",
                hint_word: "Chọn 1 tệp PDF để chuyển sang Word",
                hint_excel: "Chọn 1 tệp PDF chứa bảng dữ liệu",
                hint_image: "Chọn 1 tệp PDF để xuất ảnh từng trang",
                hint_merge: "Chọn nhiều tệp PDF để kết hợp",
                hint_split: "Chọn 1 tệp PDF và nhập số trang",
                hint_compress: "Chọn 1 tệp PDF cần giảm dung lượng",
                lblSplit: "Nhập khoảng trang muốn tách (ví dụ: 1-3, 5):",
                lblCompress: "Mức độ nén (Chất lượng ảnh):",
                optLow: "Nén nhẹ (Chất lượng tốt - 75%)",
                optMed: "Nén vừa (Cân bằng - 50%)",
                optHigh: "Nén cao (Dung lượng nhỏ nhất - 30%)"
            }
        };

        const toolConfig = {
            removebg: { accept: 'image/*', multiple: false },
            img2pdf: { accept: 'image/*', multiple: true },
            word: { accept: 'application/pdf', multiple: false },
            excel: { accept: 'application/pdf', multiple: false },
            image: { accept: 'application/pdf', multiple: false },
            merge: { accept: 'application/pdf', multiple: true },
            split: { accept: 'application/pdf', multiple: false },
            compress: { accept: 'application/pdf', multiple: false }
        };

        // Setup Drag & Drop Events
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');

        dropZone.addEventListener('click', () => fileInput.click());

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropZone.classList.add('drag-over');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropZone.classList.remove('drag-over');
            }, false);
        });

        dropZone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            if (files && files.length > 0) {
                handleFileSelect(files);
            }
        }, false);

        function handleFileSelect(files) {
            selectedFilesObject = files;
            const fileNameDisplay = document.getElementById('selectedFileName');
            if (files.length === 1) {
                fileNameDisplay.innerText = `📂 Selected: ${files[0].name}`;
            } else {
                fileNameDisplay.innerText = `📂 Selected: ${files.length} files`;
            }
        }

        function switchLanguage(lang) {
            currentLang = lang;
            const dict = i18n[lang];
            document.getElementById('page-title').innerText = dict.pageTitle;
            document.getElementById('main-heading').innerText = dict.mainHeading;
            document.getElementById('main-sub').innerText = dict.mainSub;
            document.getElementById('badge-text').innerText = dict.badgeText;
            document.getElementById('runBtn').innerText = dict.runBtn;
            document.getElementById('drop-text').innerHTML = dict.dropText.replace('browse', `<span class="text-blue-600 underline">${lang === 'vi' ? 'chọn' : 'browse'}</span>`);
            document.getElementById('lbl-split').innerText = dict.lblSplit;
            document.getElementById('lbl-compress').innerText = dict.lblCompress;

            Object.keys(dict).forEach(key => {
                const el = document.querySelector(`[data-i18n="${key}"]`);
                if (el) el.innerText = dict[key];
            });

            updateUIState();
        }

        function selectTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-card').forEach(el => el.classList.remove('active'));
            document.getElementById('card-' + tool).classList.add('active');

            const dict = i18n[currentLang];
            document.getElementById('panel-title').innerText = dict['t_' + tool];
            document.getElementById('panel-desc').innerText = dict['d_' + tool];

            selectedFilesObject = null;
            document.getElementById('selectedFileName').innerText = '';
            updateUIState();
            document.getElementById('statusText').innerText = '';
        }

        function updateUIState() {
            const dict = i18n[currentLang];
            document.getElementById('file-hint').innerText = dict['hint_' + currentTool] || '';
            fileInput.accept = toolConfig[currentTool].accept;
            fileInput.multiple = toolConfig[currentTool].multiple;

            document.getElementById('opt-split').classList.toggle('hidden', currentTool !== 'split');
            document.getElementById('opt-compress').classList.toggle('hidden', currentTool !== 'compress');
        }

        function setStatus(msg) {
            document.getElementById('statusText').innerText = msg;
        }

        function downloadBlob(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        async function runTool() {
            const files = selectedFilesObject || fileInput.files;
            if (!files || files.length === 0) {
                alert(currentLang === 'vi' ? 'Vui lòng chọn hoặc kéo thả tệp trước!' : 'Please select or drop a file first!');
                return;
            }

            const btn = document.getElementById('runBtn');
            btn.disabled = true;
            btn.classList.add('opacity-50');

            try {
                if (currentTool === 'removebg') await handleRemoveBackground(files[0]);
                else if (currentTool === 'img2pdf') await handleImagesToPdf(files);
                else if (currentTool === 'word') await handlePdfToWord(files[0]);
                else if (currentTool === 'excel') await handlePdfToExcel(files[0]);
                else if (currentTool === 'image') await handlePdfToImages(files[0]);
                else if (currentTool === 'merge') await handleMergePdf(files);
                else if (currentTool === 'split') await handleSplitPdf(files[0]);
                else if (currentTool === 'compress') await handleCompressPdf(files[0]);
            } catch (err) {
                console.error(err);
                setStatus('❌ Error: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-50');
            }
        }

        async function handleRemoveBackground(file) {
            setStatus(currentLang === 'vi' ? '⏳ Đang xử lý xóa phông nền...' : '⏳ Removing background...');
            const imageBytes = await file.arrayBuffer();
            const blob = new Blob([imageBytes]);
            const url = URL.createObjectURL(blob);
            const img = new Image();
            await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });

            const canvas = document.createElement('canvas');
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);

            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;
            const sampleColor = { r: data[0], g: data[1], b: data[2] };
            const threshold = 40;

            for (let i = 0; i < data.length; i += 4) {
                const diff = Math.abs(data[i] - sampleColor.r) + Math.abs(data[i+1] - sampleColor.g) + Math.abs(data[i+2] - sampleColor.b);
                if (diff < threshold * 3) data[i+3] = 0;
            }

            ctx.putImageData(imgData, 0, 0);
            canvas.toBlob((b) => {
                downloadBlob(b, file.name.replace(/\.[^/.]+$/, '') + '-no-bg.png');
                setStatus(currentLang === 'vi' ? '✅ Xóa phông thành công!' : '✅ Background removed successfully!');
            }, 'image/png');
        }

        async function handleImagesToPdf(files) {
            setStatus(currentLang === 'vi' ? '⏳ Đang gộp ảnh thành PDF...' : '⏳ Converting images to PDF...');
            const pdfDoc = await PDFLib.PDFDocument.create();

            for (let i = 0; i < files.length; i++) {
                const imageBytes = await files[i].arrayBuffer();
                const jpgBytes = await new Promise((res, rej) => {
                    const blob = new Blob([imageBytes]);
                    const url = URL.createObjectURL(blob);
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = img.width; canvas.height = img.height;
                        canvas.getContext('2d').drawImage(img, 0, 0);
                        canvas.toBlob((b) => b.arrayBuffer().then(res).catch(rej), 'image/jpeg', 0.9);
                    };
                    img.onerror = rej; img.src = url;
                });
                const embeddedImage = await pdfDoc.embedJpg(jpgBytes);
                const dims = embeddedImage.scale(1);
                const page = pdfDoc.addPage([dims.width, dims.height]);
                page.drawImage(embeddedImage, { x: 0, y: 0, width: dims.width, height: dims.height });
            }

            const pdfBytes = await pdfDoc.save();
            downloadBlob(new Blob([pdfBytes], { type: 'application/pdf' }), 'merged-images.pdf');
            setStatus(currentLang === 'vi' ? '✅ Gộp ảnh thành PDF thành công!' : '✅ Images merged into PDF successfully!');
        }

        async function handlePdfToWord(file) {
            setStatus(currentLang === 'vi' ? '⏳ Đang trích xuất sang Word...' : '⏳ Extracting text to Word...');
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            const paragraphs = [];

            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                const pageText = textContent.items.map(item => item.str).join(' ');
                paragraphs.push(new docx.Paragraph({ children: [new docx.TextRun(pageText)], spacing: { after: 200 } }));
            }

            const doc = new docx.Document({ sections: [{ children: paragraphs }] });
            const blob = await docx.Packer.toBlob(doc);
            downloadBlob(blob, file.name.replace(/\.pdf$/i, '') + '.docx');
            setStatus(currentLang === 'vi' ? '✅ Đã chuyển sang Word thành công!' : '✅ Converted to Word successfully!');
        }

        async function handlePdfToExcel(file) {
            setStatus(currentLang === 'vi' ? '⏳ Đang trích xuất dữ liệu sang Excel...' : '⏳ Extracting tables to Excel...');
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            const rows = [];

            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                const lineMap = {};
                textContent.items.forEach(item => {
                    const y = Math.round(item.transform[5]);
                    if (!lineMap[y]) lineMap[y] = [];
                    lineMap[y].push({ x: item.transform[4], text: item.str });
                });
                Object.keys(lineMap).sort((a, b) => b - a).forEach(y => {
                    rows.push(lineMap[y].sort((a, b) => a.x - b.x).map(c => c.text));
                });
            }

            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), 'Data');
            const xlsxData = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
            downloadBlob(new Blob([xlsxData]), file.name.replace(/\.pdf$/i, '') + '.xlsx');
            setStatus(currentLang === 'vi' ? '✅ Xuất Excel thành công!' : '✅ Exported to Excel successfully!');
        }

        async function handlePdfToImages(file) {
            setStatus(currentLang === 'vi' ? '⏳ Đang render trang sang ảnh và nén ZIP...' : '⏳ Rendering pages and zipping...');
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            const zip = new JSZip();

            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const viewport = page.getViewport({ scale: 2.0 });
                const canvas = document.createElement('canvas');
                canvas.width = viewport.width; canvas.height = viewport.height;
                await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
                zip.file(`page-${i}.png`, canvas.toDataURL('image/png').split(',')[1], { base64: true });
            }

            downloadBlob(await zip.generateAsync({ type: 'blob' }), file.name.replace(/\.pdf$/i, '') + '-images.zip');
            setStatus(currentLang === 'vi' ? '✅ Tải tệp ZIP thành công!' : '✅ Downloaded image zip successfully!');
        }

        async function handleMergePdf(files) {
            if (files.length < 2) {
                alert(currentLang === 'vi' ? 'Vui lòng chọn từ 2 file PDF trở lên!' : 'Please select at least 2 PDF files!');
                return;
            }
            setStatus(currentLang === 'vi' ? '⏳ Đang gộp các file PDF...' : '⏳ Merging PDF files...');
            const mergedPdf = await PDFLib.PDFDocument.create();

            for (const file of files) {
                const pdf = await PDFLib.PDFDocument.load(await file.arrayBuffer());
                const pages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
                pages.forEach(p => mergedPdf.addPage(p));
            }

            downloadBlob(new Blob([await mergedPdf.save()], { type: 'application/pdf' }), 'merged.pdf');
            setStatus(currentLang === 'vi' ? '✅ Gộp PDF thành công!' : '✅ PDFs merged successfully!');
        }

        async function handleSplitPdf(file) {
            const rangeStr = document.getElementById('splitRange').value.trim();
            if (!rangeStr) {
                alert(currentLang === 'vi' ? 'Vui lòng nhập khoảng trang cần tách!' : 'Please enter page range!');
                return;
            }
            setStatus(currentLang === 'vi' ? '⏳ Đang tách file PDF...' : '⏳ Splitting PDF...');
            const srcPdf = await PDFLib.PDFDocument.load(await file.arrayBuffer());
            const total = srcPdf.getPageCount();
            const indices = new Set();

            rangeStr.split(',').forEach(part => {
                const b = part.trim().split('-').map(Number);
                if (b.length === 1 && b[0] >= 1 && b[0] <= total) indices.add(b[0] - 1);
                else if (b.length === 2) for (let p = Math.max(1, b[0]); p <= Math.min(total, b[1]); p++) indices.add(p - 1);
            });

            const newPdf = await PDFLib.PDFDocument.create();
            const copied = await newPdf.copyPages(srcPdf, Array.from(indices));
            copied.forEach(p => newPdf.addPage(p));

            downloadBlob(new Blob([await newPdf.save()], { type: 'application/pdf' }), 'split-' + file.name);
            setStatus(currentLang === 'vi' ? '✅ Tách PDF thành công!' : '✅ PDF split successfully!');
        }

        async function handleCompressPdf(file) {
            const quality = parseFloat(document.getElementById('compressLevel').value);
            setStatus(currentLang === 'vi' ? '⏳ Đang nén file PDF...' : '⏳ Compressing PDF...');
            const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
            const outPdf = await PDFLib.PDFDocument.create();

            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const viewport = page.getViewport({ scale: 1.3 });
                const canvas = document.createElement('canvas');
                canvas.width = viewport.width; canvas.height = viewport.height;
                await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;

                const img = await outPdf.embedJpg(canvas.toDataURL('image/jpeg', quality));
                const newPage = outPdf.addPage([viewport.width, viewport.height]);
                newPage.drawImage(img, { x: 0, y: 0, width: viewport.width, height: viewport.height });
            }

            const outBytes = await outPdf.save();
            const oldKB = (file.size / 1024).toFixed(1);
            const newKB = (outBytes.byteLength / 1024).toFixed(1);
            downloadBlob(new Blob([outBytes], { type: 'application/pdf' }), 'compressed-' + file.name);
            setStatus(currentLang === 'vi' ? `✅ Nén thành công từ ${oldKB} KB xuống ${newKB} KB!` : `✅ Compressed from ${oldKB} KB to ${newKB} KB!`);
        }
    </script>
